# Netlify settings for hemedex.com. Plain static site: no build step, publish the repo root.
# Redirects from the old WordPress URLs live in _redirects.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Images, fonts, CSS and JS are cached for a year; rename a file (or add ?v=2) when you replace it.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/papers/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
